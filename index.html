<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teh Talk: F&B Sentiment in Singapore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { display: ['"Bricolage Grotesque"', 'sans-serif'], sans: ['"DM Sans"', 'sans-serif'] },
        colors: { ink: '#1E2A26', paper: '#F2F5F1', matcha: '#2F6B55', boba: '#7A4E2D', chili: '#B8402F', mist: '#D9E0DA' }
      } }
    }
  </script>
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <div class="mx-auto max-w-5xl px-5 py-8">

    <header class="flex flex-wrap items-center justify-between gap-4">
      <div>
        <h1 class="font-display text-2xl font-bold">Teh Talk</h1>
        <p class="text-sm text-ink/60">What Singapore is saying about its drinks, from r/singapore</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="source" class="rounded-full bg-mist px-3 py-1 text-xs text-ink/70">Loading…</span>
        <label class="sr-only" for="category">Category</label>
        <select id="category" class="rounded-lg border border-mist bg-white px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-matcha">
          <option value="fnb">Food &amp; Beverage</option>
          <option value="beauty">Beauty &amp; Skincare (soon)</option>
        </select>
      </div>
    </header>

    <!-- Net sentiment gauge -->
    <section class="mt-8 rounded-2xl bg-white p-6 shadow-sm" aria-labelledby="nsi-title">
      <div class="flex flex-wrap items-end justify-between gap-6">
        <div>
          <h2 id="nsi-title" class="text-sm font-medium text-ink/60">Net Sentiment Index</h2>
          <p class="mt-1 font-display text-6xl font-bold leading-none"><span id="nsi">0</span></p>
          <p class="mt-2 text-sm text-ink/60">Share of positive mentions minus share of negative, from -100 to +100</p>
        </div>
        <dl class="flex gap-8 text-sm">
          <div><dt class="text-ink/60">Total mentions</dt><dd id="total" class="font-display text-3xl font-bold">0</dd></div>
          <div><dt class="text-ink/60">Positive</dt><dd id="pos" class="font-display text-3xl font-bold text-matcha">0</dd></div>
          <div><dt class="text-ink/60">Negative</dt><dd id="neg" class="font-display text-3xl font-bold text-chili">0</dd></div>
        </dl>
      </div>
      <div class="relative mt-6 h-3 rounded-full" style="background:linear-gradient(90deg,#B8402F 0%,#D9E0DA 50%,#2F6B55 100%)" role="img" aria-label="Sentiment gauge">
        <div id="marker" class="absolute top-1/2 h-6 w-6 -translate-x-1/2 -translate-y-1/2 rounded-full border-4 border-white bg-ink shadow transition-all duration-500" style="left:50%"></div>
      </div>
      <div class="mt-2 flex justify-between text-xs text-ink/50"><span>-100</span><span>0</span><span>+100</span></div>
    </section>

    <!-- Brand filter -->
    <section class="mt-8">
      <h2 class="font-display text-lg font-bold">Recent mentions</h2>
      <div id="brands" class="mt-3 flex flex-wrap gap-2"></div>
    </section>

    <div id="empty" class="mt-6 hidden rounded-2xl border border-dashed border-mist p-10 text-center text-ink/60"></div>
    <ul id="feed" class="mt-4 space-y-3"></ul>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const state = { category: 'fnb', brand: null };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const TAG = {
    Positive: 'bg-matcha/10 text-matcha',
    Neutral: 'bg-mist text-ink/70',
    Negative: 'bg-chili/10 text-chili',
  };

  function ago(iso) {
    const mins = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
    if (mins < 60) return mins + 'm ago';
    if (mins < 1440) return Math.round(mins / 60) + 'h ago';
    return Math.round(mins / 1440) + 'd ago';
  }

  function chips(list, cls) {
    return list.map((t) => `<span class="rounded-md px-2 py-0.5 text-xs ${cls}">${esc(t)}</span>`).join(' ');
  }

  function renderBrands(brands) {
    const all = [{ brand_name: null, label: 'All brands' }, ...brands.map((b) => ({ ...b, label: `${b.brand_name} (${b.mentions})` }))];
    $('brands').innerHTML = all.map((b) => {
      const active = state.brand === b.brand_name;
      return `<button data-brand="${esc(b.brand_name ?? '')}" class="rounded-full border px-3 py-1 text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-matcha ${active ? 'border-ink bg-ink text-white' : 'border-mist bg-white hover:border-ink/40'}">${esc(b.label)}</button>`;
    }).join('');
    document.querySelectorAll('#brands button').forEach((btn) => btn.addEventListener('click', () => {
      state.brand = btn.dataset.brand || null;
      load();
    }));
  }

  function renderItem(i) {
    const pros = i.pros.length ? `<div><p class="text-xs font-medium text-matcha">Pros</p><div class="mt-1 flex flex-wrap gap-1">${chips(i.pros, 'bg-matcha/10 text-matcha')}</div></div>` : '';
    const cons = i.cons.length ? `<div><p class="text-xs font-medium text-chili">Cons</p><div class="mt-1 flex flex-wrap gap-1">${chips(i.cons, 'bg-chili/10 text-chili')}</div></div>` : '';
    const link = i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener" class="text-xs text-ink/50 underline hover:text-ink">View on Reddit</a>` : '';
    return `<li class="rounded-2xl bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="font-display text-lg font-bold">${esc(i.brand_name)}</span>
          <span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${TAG[i.sentiment_label]}">${esc(i.sentiment_label)} ${i.sentiment_score > 0 ? '+' : ''}${i.sentiment_score.toFixed(2)}</span>
        </div>
        <span class="text-xs text-ink/50">${ago(i.timestamp)}</span>
      </div>
      <p class="mt-3 max-w-prose text-sm leading-relaxed text-ink/80">${esc(i.raw_text.length > 280 ? i.raw_text.slice(0, 280) + '…' : i.raw_text)}</p>
      <div class="mt-4 flex flex-wrap items-start gap-6">${pros}${cons}${!pros && !cons && i.key_themes.length ? `<div class="flex flex-wrap gap-1">${chips(i.key_themes, 'bg-mist text-ink/70')}</div>` : ''}</div>
      <div class="mt-3">${link}</div>
    </li>`;
  }

  async function load() {
    const params = new URLSearchParams({ category: state.category });
    if (state.brand) params.set('brand', state.brand);
    let data;
    try {
      const res = await fetch('/api/mentions?' + params);
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (e) {
      $('empty').textContent = 'Could not load mentions. Check that the API is running and refresh.';
      $('empty').classList.remove('hidden');
      return;
    }

    const s = data.summary;
    $('nsi').textContent = (s.net_sentiment_index > 0 ? '+' : '') + s.net_sentiment_index;
    $('total').textContent = s.total_mentions;
    $('pos').textContent = s.counts.Positive;
    $('neg').textContent = s.counts.Negative;
    $('marker').style.left = ((s.net_sentiment_index + 100) / 2) + '%';
    $('source').textContent = data.source === 'reddit' ? 'Live from Reddit' : data.source === 'mock' ? 'Sample data' : 'No data yet';

    if (state.category === 'fnb') renderBrands(s.brands); else $('brands').innerHTML = '';
    $('feed').innerHTML = data.items.map(renderItem).join('');
    const empty = data.items.length === 0;
    $('empty').classList.toggle('hidden', !empty);
    if (empty) $('empty').textContent = data.message || 'No mentions found for this filter yet.';
  }

  $('category').addEventListener('change', (e) => { state.category = e.target.value; state.brand = null; load(); });
  load();
</script>
</body>
</html>
